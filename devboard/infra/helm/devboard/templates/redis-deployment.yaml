{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: devboard-redis }
  template:
    metadata:
      labels: { app: devboard-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: devboard-redis
spec:
  selector: { app: devboard-redis }
  ports: [{ port: 6379 }]
{{- end }}
