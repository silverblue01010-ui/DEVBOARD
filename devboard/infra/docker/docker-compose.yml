version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devboard
      POSTGRES_PASSWORD: devboard
      POSTGRES_DB: devboard
    ports:
      - "5433:5432"
    volumes:
      - devboard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://devboard:devboard@postgres:5432/devboard
      REDIS_URL: redis://redis:6379
      ANALYZER_URL: http://analyzer:8000
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/api:/repo/apps/api
      - ../../packages:/repo/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "worker"]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://devboard:devboard@postgres:5432/devboard
      REDIS_URL: redis://redis:6379
      ANALYZER_URL: http://analyzer:8000
    volumes:
      - ../../apps/api:/repo/apps/api
      - ../../packages:/repo/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  analyzer:
    build:
      context: ../../apps/analyzer
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://devboard:devboard@postgres:5432/devboard
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/analyzer:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  devboard_pg_data:
